<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support, Dig</title>
<meta name="description" content="Support for the Dig app: account, billing, privacy or product questions, write to contact@digrecords.fr.">
<meta property="og:title" content="Support, Dig">
<meta property="og:description" content="For account, billing, privacy or product support, contact contact@digrecords.fr.">
<meta property="og:image" content="https://digrecords.app/banner.jpg">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Dig's design, as in the app (src/theme/tokens.ts) and the shop site: black ground, one accent, Helvetica, pills. */
  :root { --ground:#000; --surface:#141414; --surface2:#1E1E1E; --line:#2A2A2A; --ink:#F2EFE8; --ink2:#B4B4B4; --ink3:#6F6F6F; --accent:#FF3D1F; --content:1260px; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--ground); color:var(--ink); margin:0; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; font-size:17px; line-height:1.5; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:var(--content); margin:0 auto; padding:0 clamp(20px, 5vw, 96px); }
  /* the ribbon is cream, as on the shop site, so the wordmark's black extrusion shows (Liana, 2026-09-14 19:39) */
  header { position:sticky; top:0; background:#F2EFE8; border-bottom:1px solid #d8d0bd; z-index:5; }
  header .wrap { display:flex; align-items:center; justify-content:space-between; height:84px; gap:16px; }
  header img { height:44px; display:block; }
  .lang { display:flex; gap:6px; align-items:center; }
  .lang .ig { color:#111; display:flex; margin-right:8px; }
  .lang .ig:hover { color:var(--accent); }
  .lang button { font:inherit; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid #cfc8b6; background:transparent; color:#444; cursor:pointer; }
  .lang button.on { background:#111; color:#F2EFE8; border-color:#111; }
  .kicker { font-size:11px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
  h1 { font-size:clamp(36px, 5.2vw, 72px); line-height:1.02; letter-spacing:-1.4px; font-weight:700; margin:0 0 18px; text-wrap:balance; }
  h2 { font-size:clamp(24px, 3vw, 34px); line-height:1.1; letter-spacing:-.6px; font-weight:700; margin:0 0 12px; }
  p { margin:0 0 14px; color:var(--ink2); }
  p.lead { color:var(--ink); font-size:clamp(18px, 1.5vw, 22px); }
  .btn { display:inline-flex; align-items:center; justify-content:center; font:inherit; font-weight:600; font-size:15px; height:48px; padding:0 24px; border-radius:999px; background:var(--accent); color:#000; border:0; cursor:pointer; white-space:nowrap; }
  .btn:hover { opacity:.9; text-decoration:none; }
  .btn.secondary { background:var(--surface2); color:var(--ink); }

  /* hero: the words and the form on the left, the deck on the right */
  .hero { padding:32px 0 56px; }
  .hero .wrap { display:grid; grid-template-columns:minmax(0, 1fr) minmax(320px, 440px); gap:clamp(32px, 5vw, 80px); align-items:center; }
  @media (max-width: 860px) { .hero .wrap { grid-template-columns:1fr; } }
  form.wait { display:flex; gap:10px; margin:28px 0 10px; max-width:520px; }
  form.wait input { flex:1; min-width:0; font:inherit; font-size:16px; height:48px; padding:0 18px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:999px; }
  form.wait input:focus { outline:none; border-color:var(--ink2); }
  @media (max-width: 480px) { form.wait { flex-direction:column; } }
  .fine { font-size:13px; color:var(--ink3); }
  .thanks { display:none; background:var(--surface); padding:18px 20px; margin:28px 0 10px; max-width:520px; border-left:3px solid var(--accent); }
  .thanks b { color:var(--ink); }

  /* the station: a phone-sized deck, exactly the app's layout, in the browser */
  .station { width:100%; max-width:440px; margin:0 auto; background:var(--ground); border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .deck { position:relative; width:100%; aspect-ratio:390/470; overflow:hidden; background:#000; touch-action:none; user-select:none; -webkit-user-select:none; cursor:default; }
  .deck > img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  .deck .base { position:absolute; pointer-events:none; }
  .deck .platter { position:absolute; border-radius:50%; overflow:hidden; background:#161616; will-change:transform; }
  .deck .platter > div { position:absolute; border-radius:50%; }
  .deck .label { overflow:hidden; background:#E8E4DA; }
  .deck .label img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .deck .spindle { position:absolute; width:9px; height:9px; border-radius:50%; background:#B8B8B8; border:1px solid #6A6A6A; left:50%; top:50%; transform:translate(-50%,-50%); }
  .deck .arm { position:absolute; pointer-events:none; will-change:transform; }
  .deck .arm img { position:absolute; display:block; }
  .deck .arm img.tube { inset:0; width:100%; height:100%; }
  .deck .hint { position:absolute; left:12px; bottom:10px; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:#e9e2d0; text-shadow:0 1px 6px rgba(0,0,0,.8); pointer-events:none; opacity:.9; }
  .deck.grabbing { cursor:grabbing; }
  .controls { padding:16px 16px 18px; }
  .controls .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .controls .title { font-size:20px; font-weight:700; letter-spacing:-.4px; line-height:1.15; color:var(--ink); }
  .controls .sub { font-size:13px; color:var(--ink2); margin-top:2px; }
  .controls .now { font-size:13px; color:var(--ink3); margin-top:2px; min-height:17px; }
  .controls .row { display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px; }
  .controls .group { display:flex; gap:8px; }
  .pill { height:40px; min-width:48px; padding:0 14px; border-radius:20px; background:var(--surface); color:var(--ink); border:0; font:inherit; font-size:13px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .pill:hover { background:var(--surface2); }
  .pill.wide { min-width:64px; }
  .pill:disabled { color:var(--ink3); cursor:default; }
  .pill svg { width:16px; height:16px; fill:currentColor; }
  .pill.wide svg { width:22px; height:22px; }
  .decide { display:flex; gap:8px; margin-top:12px; }
  .decide .btn { flex:1; padding:0; }
  .decide .btn.ghost { background:transparent; color:var(--ink); flex:.7; }

  footer { padding:36px 0 60px; font-size:14px; color:var(--ink3); }
  footer .row { display:flex; flex-wrap:wrap; gap:14px 24px; margin-bottom:12px; }
  footer a { color:var(--ink2); }
  [data-fr], [data-en] { display:none; }
  html[lang="fr"] [data-fr], html[lang="en"] [data-en] { display:revert; }
  html[lang="fr"] span[data-fr], html[lang="en"] span[data-en] { display:inline; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }

  /* support page (Mark, 2026-09-25): one paragraph, the address, nothing else to get lost in */
  .support { padding:64px 0 96px; min-height:60vh; }
  .support .wrap { max-width:720px; }
  .support .mail { display:inline-block; font-size:clamp(22px, 2.6vw, 30px); font-weight:700; letter-spacing:-.4px; margin:6px 0 22px; }
  .support ul { margin:0 0 24px; padding-left:20px; color:var(--ink2); }
  .support li { margin:4px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="#top" aria-label="Dig"><a href="/"><img src="dig.png" alt="DIG"></a></a>
    <div class="lang">
      <a class="ig" href="https://www.instagram.com/dig_records/" target="_blank" rel="noopener" aria-label="Instagram @dig_records"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <button id="l-en" onclick="setLang('en')">EN</button><button id="l-fr" onclick="setLang('fr')">FR</button>
    </div>
  </div>
</header>

<main class="support">
  <div class="wrap">
    <div class="kicker">Support</div>
    <p class="lead">For account, billing, privacy, or product support, contact <a href="mailto:contact@digrecords.fr">contact@digrecords.fr</a>.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="row"><a href="https://www.instagram.com/dig_records/" target="_blank" rel="noopener">@dig_records</a><a href="mailto:contact@digrecords.fr">contact@digrecords.fr</a><a href="support.html">Support</a></div>
    <div>© 2026 DIG</div>
  </div>
</footer>
</body>
</html>
